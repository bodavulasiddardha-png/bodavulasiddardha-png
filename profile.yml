projects:
  - title: WhatsApp Lead Bot
    date: 2026
    description: >-
      Production WhatsApp bot on n8n and WAHA. An LLM classifies each inbound lead,
      replies in real time and syncs qualified leads to Google Sheets. Serves live
      traffic for a paying education client.
    tech: [n8n, WAHA, LLM, Google Sheets]
    live: true
    url: https://navaprastha.pages.dev
    key: whatsapp-bot
  - title: unknownbhaarath
    date: Jun 2026
    description: >-
      Autonomous, self-healing content agent on GitHub Actions. Researches,
      fact-checks, designs and publishes 3 posts a day with a 4-layer fallback
      chain. Running unattended for months.
    tech: [GitHub Actions, Claude, Groq, Puppeteer, Node.js]
    live: true
    url: https://github.com/bodavulasiddardha-png/unknownbhaarath
    key: unknownbhaarath
  - title: Telugu Voice Agent
    date: Sep 2026
    description: >-
      Inbound voice agent that answers calls in Telugu and English. Custom Bolna
      synthesizer on a self-hosted Telugu TTS server. Works end to end; TTS latency
      is the open problem, so it stays a prototype.
    tech: [Bolna, Deepgram, Groq, Twilio, FastAPI]
    url: https://github.com/bodavulasiddardha-png/telugu-voice-agent
    key: voice-agent
  - title: n8n AI Workflows
    date: Jun 2026
    description: >-
      Gmail triage agent that classifies mail with Claude and routes it to labels
      and Telegram, plus an AI job-match bot that scores listings against a profile.
    tech: [n8n, Claude API, Gmail, Telegram]
    url: https://github.com/bodavulasiddardha-png/N8N-Automation-Workflows
    key: n8n-workflows

